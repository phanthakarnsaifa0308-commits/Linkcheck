<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saifa Mass Order Helper - Purple Edition</title>
    <style>
        :root {
            --primary-color: #6C5CE7;
            --primary-light: #A29BFE;
            --secondary-color: #00B894;
            --bg-body: #F9F7FD;
            --text-dark: #2D3436;
            --accent-purple: #F3E8FF;
        }

        body { font-family: -apple-system, sans-serif; background-color: var(--bg-body); padding: 15px; margin: 0; }
        .container { background: #ffffff; max-width: 500px; margin: 10px auto; padding: 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(108, 92, 231, 0.1); }
        h2 { text-align: center; font-size: 1.4rem; margin-bottom: 25px; color: var(--primary-color); }

        textarea { width: 100%; padding: 15px; border: 2px solid #EEE9F5; border-radius: 16px; box-sizing: border-box; font-size: 14px; outline: none; }
        
        .btn { width: 100%; padding: 16px; border: none; border-radius: 16px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-blue { background: linear-gradient(135deg, var(--primary-color), var(--primary-light)); color: white; margin-bottom: 20px; }
        .btn-green { background-color: var(--secondary-color); color: white; margin-top: 20px; }

        .table-container { overflow-x: auto; margin-top: 10px; border-radius: 16px; border: 1px solid #F0EAFB; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 350px; }
        th { background: #F8F6FD; text-align: left; padding: 12px; color: #6C5CE7; }
        td { padding: 15px 12px; border-bottom: 1px solid #F8F6FD; vertical-align: middle; }

        /* สไตล์ช่องแก้จำนวนในตาราง */
        .inline-qty {
            width: 70px;
            padding: 8px 5px;
            border: 1.5px solid var(--primary-light);
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
            background: var(--accent-purple);
            outline: none;
        }

        .link-text { word-break: break-all; color: #4A5568; display: block; font-size: 12px; margin-bottom: 5px; }
        .btn-check { background-color: #FFF; color: var(--primary-color); padding: 7px 14px; border-radius: 10px; font-size: 11px; border: 1.5px solid var(--primary-light); cursor: pointer; margin-top: 8px; }

        .config-card { display: flex; gap: 12px; margin-top: 25px; background: #FDFBFF; padding: 18px; border-radius: 20px; border: 1px solid #F0EAFB; }
        .config-card input { width: 100%; padding: 10px; border: 1.5px solid #EEE9F5; border-radius: 12px; text-align: center; font-weight: bold; outline: none; }

        #finalResult { margin-top: 25px; display: none; border-top: 2px dashed #EEE9F5; padding-top: 20px; }
        .result-area { background: #FAFAFF !important; border: 2px solid #E0D7FF !important; color: #4834D4 !important; font-weight: 600; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h2>Mass order by Ptk Saifa🌟</h2>
    
    <label style="font-weight:600; color:#4834D4;">🔮 วางลิงก์ที่นี่</label>
    <textarea id="inputLinks" rows="5" placeholder="วางลิงก์ได้เลยระบบจะเว้นบรรทัดให้อัตโนมัติ..."></textarea>

    <button class="btn btn-blue" onclick="generateTable()" style="margin-top:15px;">✨ สร้างรายการ Mass order</button>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 15%;">ไอดี</th>
                    <th>ลิงก์ / เช็คคลิป</th>
                    <th style="width: 25%; text-align: center;">จำนวน (แก้ไขได้)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="config-card">
        <div><small>🆔 ไอดีบริการ</small><input type="text" id="serviceId" value="4525"></div>
        <div><small>📊 จำนวนเริ่มต้น</small><input type="number" id="quantity" placeholder="ระบุจำนวน"></div>
    </div>

    <button class="btn btn-green" onclick="generateMassOrder()">🪄 สร้าง Mass Order เลย!! </button>

    <div id="finalResult">
        <label>✅ รายการ Mass order:</label>
        <textarea id="outputArea" rows="6" readonly class="result-area"></textarea>
        <button class="btn btn-blue" style="margin-top:12px;" onclick="copyToClipboard()">📋 คัดลอกทั้งหมด</button>
    </div>
</div>

<script>
    const inputArea = document.getElementById('inputLinks');

    inputArea.addEventListener('input', () => {
        let content = inputArea.value;
        let fixedContent = content.replace(/([^\n])(https:\/\/)/g, '$1\n$2');
        if (content !== fixedContent) { inputArea.value = fixedContent; }
    });

    function generateTable() {
        const links = inputArea.value.split('\n').map(l => l.trim()).filter(l => l !== '');
        const sid = document.getElementById('serviceId').value;
        const qty = document.getElementById('quantity').value;
        const tbody = document.getElementById('tableBody');
        
        tbody.innerHTML = '';
        links.forEach((link, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="font-weight:bold; color:#6C5CE7;">${sid}</td>
                <td>
                    <span class="link-text">${link}</span>
                    <button class="btn-check" onclick="window.open('${link}', '_blank'); this.style.background='#6C5CE7'; this.style.color='#fff';">👁️ เช็คคลิป</button>
                </td>
                <td style="text-align: center;">
                    <input type="number" class="inline-qty" value="${qty}" id="qty_${index}">
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    function generateMassOrder() {
        const links = inputArea.value.split('\n').map(l => l.trim()).filter(l => l !== '');
        const sid = document.getElementById('serviceId').value;
        if (links.length === 0) return alert('ใส่ลิงก์ก่อนนะ!');

        const result = links.map((l, i) => {
            const currentQty = document.getElementById(`qty_${i}`).value;
            return `${sid}|${l}|${currentQty}`;
        }).join('\n');

        document.getElementById('outputArea').value = result;
        document.getElementById('finalResult').style.display = 'block';
        document.getElementById('finalResult').scrollIntoView({ behavior: 'smooth' });
    }

    function copyToClipboard() {
        const output = document.getElementById('outputArea');
        output.select();
        navigator.clipboard.writeText(output.value);
        alert('คัดลอกเรียบร้อย 💜');
    }
</script>
</body>
</html>
